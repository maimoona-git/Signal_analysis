<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deconflicted Signal Analysis</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    /* Phase 5 (site design system): the loading/error/drop-zone chrome around
       the Qt canvas adopts the shared tokens (site/src/styles/tokens.css,
       copied verbatim into css/tokens.css -- edit there, not here) and
       self-hosted IBM Plex fonts, matching /site's instrument-panel look.
       The mounted Qt canvas itself (#screen) is untouched: it's native Qt
       Widgets rendering, not CSS, and out of scope here (see CLAUDE.md's
       Phase 5). No functional behaviour changed -- same ids, same JS below. */
    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink-950);
      color: var(--ink-text);
      font-family: var(--font-sans);
    }
    #screen { position: fixed; inset: 0; display: none; }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      text-align: center;
      padding: var(--space-5);
      font-family: var(--font-mono);
      font-size: var(--text-lg);
    }
    #status::before {
      content: "";
      display: inline-block;
      width: 0.6em;
      height: 0.6em;
      margin-right: 0.6em;
      border-radius: 50%;
      background: var(--phosphor);
    }
    #status.error { color: var(--amber); }
    #status.error::before { background: var(--amber); }
    #status small {
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      max-width: 40rem;
    }
    #drop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(13, 17, 23, 0.85);
      border: 2px dashed var(--phosphor-dim);
      font-family: var(--font-mono);
      font-size: var(--text-xl);
      color: var(--phosphor);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- App shell: hosts the Qt-for-WASM canvas and supplies the two things the WASM module
       cannot do itself: (1) the ML model, run with onnxruntime-web, which the C++ pipeline
       calls out to through Module.sigMlClassifier (see bridge/README.md), and (2) dropping a
       file onto the page. Everything is served from this origin: no CDN or third-party requests (there is
       no service worker, so the host still has to serve these files).
       Single-threaded build: no COOP/COEP headers needed on the host. -->
  <div id="status">Loading Deconflicted…<small id="detail"></small></div>
  <div id="screen"></div>
  <div id="drop">Drop a .wav or .IQ capture to load it</div>

  <script src="sigapp.js"></script>
  <script src="qtloader.js"></script>
  <script type="module">
    import * as ort from './vendor/ort/ort.wasm.min.mjs';
    import { createOnnxClassifier } from './js/onnx-classifier.mjs';

    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const screen = document.getElementById('screen');
    const drop = document.getElementById('drop');
    const fail = (message, error) => {
      console.error(message, error);
      status.className = 'error';
      status.firstChild.textContent = message;
      detail.textContent = String(error?.message ?? error ?? '');
      status.style.display = 'flex';
      screen.style.display = 'none';
    };

    // The model loads in the background while Qt starts. If it fails, the app still
    // opens, and an analysis reports the reason instead of the page looking dead.
    const classifier = createOnnxClassifier({
      ort,
      model: 'models/modulation_classifier.onnx',
      meta: 'models/modulation_classifier.json',
      wasmPaths: 'vendor/ort/',
    });
    classifier.catch((e) => console.error('ML model failed to load:', e));

    try {
      const app = await qtLoad({
        qt: {
          entryFunction: window.sigapp_entry,
          containerElements: [screen],
          onLoaded: () => { status.style.display = 'none'; screen.style.display = 'block'; },
          onExit: (exit) => fail('The application exited' + (exit.code !== undefined ? ` (code ${exit.code})` : ''), exit.text),
        },
        // Read by the C++ pipeline (EM_JS in bridge/src/ml_bridge.cpp): async
        // (Float32Array spectrogram, rows, cols) => { classes, probabilities }.
        sigMlClassifier: async (spectrogram, rows, cols) => (await classifier).classify(spectrogram, rows, cols),
      });
      window.sigApp = app;   // the Embind hooks (sigAppOpenFile, sigAppState), for scripts and tests

      // The analysis worker (see js/analysis-worker.js): the pipeline runs in a second WASM instance
      // off this thread, so a long search cannot freeze the UI. The Qt app asks the page whether
      // it is usable (sigWorkerRun returns false if not) and falls back to running in its own
      // module, so a browser or host that cannot start the worker still analyses, just blocking.
      let worker = null;
      let workerState = 'starting';            // starting | ready | broken
      const workerWaiting = [];                // runs requested while it was still starting
      const workerPending = new Map();         // id -> true while a run is outstanding
      const failRun = (id, message, unavailable) => { workerPending.delete(id); app.sigWorkerDone(id, null, message, unavailable); };
      const breakWorker = (message) => {
        workerState = 'broken';
        console.error('analysis worker unavailable:', message);
        for (const id of [...workerPending.keys()]) failRun(id, message, true);
        workerWaiting.length = 0;
      };
      const postRun = (job) => worker.postMessage({ type: 'run', ...job }, [job.bytes.buffer, job.options.buffer]);
      try {
        worker = new Worker('js/analysis-worker.js');
        worker.onmessage = (event) => {
          const m = event.data;
          if (m.type === 'ready') {
            workerState = 'ready';
            for (const job of workerWaiting.splice(0)) postRun(job);
          } else if (m.type === 'init-failed') {
            breakWorker(m.error);
          } else if (m.type === 'done') {
            workerPending.delete(m.id);
            app.sigWorkerDone(m.id, m.blob ?? null, m.error ?? '', false);
          }
        };
        worker.onerror = (event) => breakWorker(event.message || 'the worker crashed');
        worker.postMessage({ type: 'init', base: document.baseURI });
      } catch (e) {
        workerState = 'broken';
        console.error('could not start the analysis worker:', e);
      }
      // (id, bytes, filename, options): true if the worker took the job, false if it cannot.
      window.sigWorkerRun = (id, bytes, filename, options) => {
        if (workerState === 'broken' || !worker) return false;
        workerPending.set(id, true);
        const job = { id, bytes, filename, options };
        if (workerState === 'ready') postRun(job); else workerWaiting.push(job);
        return true;
      };
      window.sigWorkerState = () => workerState;

      // Loading a capture. A .wav, or a raw capture up to WHOLE_LIMIT, is read whole. A bigger
      // raw capture is never read whole: only one WINDOW-sized slice (Blob.slice) goes into the
      // WASM module, and "Previous/Next window" re-read another slice, so memory is bounded by
      // the window, not the file. (128 MiB = 16M complex float32 samples, the analysis window.)
      const WHOLE_LIMIT = 128 * 1024 * 1024;
      const WINDOW = 128 * 1024 * 1024;   // a multiple of 8, so every slice stays sample-aligned
      let streamed = null;                // { file, start } while a big file is being stepped through
      const openSlice = async (file, start) => {
        const length = Math.min(WINDOW, file.size - start);
        const bytes = new Uint8Array(await file.slice(start, start + length).arrayBuffer());
        streamed = { file, start };
        app.sigAppOpenWindow(bytes, file.name, file.size, start);
      };
      window.sigLoadCapture = async (file) => {
        if (/\.wav$/i.test(file.name) || file.size <= WHOLE_LIMIT) {
          streamed = null;
          app.sigAppOpenFile(new Uint8Array(await file.arrayBuffer()), file.name);
        } else {
          await openSlice(file, 0);
        }
      };
      window.sigStepWindow = async (direction) => {
        if (!streamed) return;
        const last = Math.max(0, Math.floor((streamed.file.size - 1) / WINDOW) * WINDOW);
        const start = Math.min(last, Math.max(0, streamed.start + direction * WINDOW));
        if (start === streamed.start) return;
        try { await openSlice(streamed.file, start); } catch (err) { console.error('could not load the next window', err); }
      };

      // Drag-and-drop: the same path as "Open File...", from the page.
      let depth = 0;
      addEventListener('dragenter', (e) => { if (e.dataTransfer?.types?.includes('Files')) { depth++; drop.style.display = 'flex'; e.preventDefault(); } });
      addEventListener('dragover', (e) => e.preventDefault());
      addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; drop.style.display = 'none'; } });
      addEventListener('drop', async (e) => {
        e.preventDefault();
        depth = 0;
        drop.style.display = 'none';
        const file = e.dataTransfer?.files?.[0];
        if (!file) return;
        try {
          await window.sigLoadCapture(file);
        } catch (err) {
          console.error('could not load the dropped file', err);
        }
      });
    } catch (e) {
      fail('Failed to load the application', e);
    }
  </script>
</body>
</html>
