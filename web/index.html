<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS 26147 Signal Analysis</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    /* Phase 5 (site design system): the loading/error/drop-zone chrome around
       the Qt canvas adopts the shared tokens (site/src/styles/tokens.css,
       copied verbatim into css/tokens.css -- edit there, not here) and
       self-hosted IBM Plex fonts, matching /site's instrument-panel look.
       The mounted Qt canvas itself (#screen) is untouched: it's native Qt
       Widgets rendering, not CSS, and out of scope here (see CLAUDE.md's
       Phase 5). No functional behaviour changed -- same ids, same JS below. */
    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink-950);
      color: var(--ink-text);
      font-family: var(--font-sans);
    }
    #screen { position: fixed; inset: 0; display: none; }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      text-align: center;
      padding: var(--space-5);
      font-family: var(--font-mono);
      font-size: var(--text-lg);
    }
    #status::before {
      content: "";
      display: inline-block;
      width: 0.6em;
      height: 0.6em;
      margin-right: 0.6em;
      border-radius: 50%;
      background: var(--phosphor);
    }
    #status.error { color: var(--amber); }
    #status.error::before { background: var(--amber); }
    #status small {
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      max-width: 40rem;
    }
    #drop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(13, 17, 23, 0.85);
      border: 2px dashed var(--phosphor-dim);
      font-family: var(--font-mono);
      font-size: var(--text-xl);
      color: var(--phosphor);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- App shell: hosts the Qt-for-WASM canvas and supplies the two things the WASM module
       cannot do itself: (1) the ML model, run with onnxruntime-web, which the C++ pipeline
       calls out to through Module.sigMlClassifier (see bridge/README.md), and (2) dropping a
       file onto the page. Everything is served from this origin, so it works offline.
       Single-threaded build: no COOP/COEP headers needed on the host. -->
  <div id="status">Loading PS 26147…<small id="detail"></small></div>
  <div id="screen"></div>
  <div id="drop">Drop a .wav or .IQ capture to load it</div>

  <script src="sigapp.js"></script>
  <script src="qtloader.js"></script>
  <script type="module">
    import * as ort from './vendor/ort/ort.wasm.min.mjs';
    import { createOnnxClassifier } from './js/onnx-classifier.mjs';

    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const screen = document.getElementById('screen');
    const drop = document.getElementById('drop');
    const fail = (message, error) => {
      console.error(message, error);
      status.className = 'error';
      status.firstChild.textContent = message;
      detail.textContent = String(error?.message ?? error ?? '');
      status.style.display = 'flex';
      screen.style.display = 'none';
    };

    // The model loads in the background while Qt starts. If it fails, the app still
    // opens, and an analysis reports the reason instead of the page looking dead.
    const classifier = createOnnxClassifier({
      ort,
      model: 'models/modulation_classifier.onnx',
      meta: 'models/modulation_classifier.json',
      wasmPaths: 'vendor/ort/',
    });
    classifier.catch((e) => console.error('ML model failed to load:', e));

    try {
      const app = await qtLoad({
        qt: {
          entryFunction: window.sigapp_entry,
          containerElements: [screen],
          onLoaded: () => { status.style.display = 'none'; screen.style.display = 'block'; },
          onExit: (exit) => fail('The application exited' + (exit.code !== undefined ? ` (code ${exit.code})` : ''), exit.text),
        },
        // Read by the C++ pipeline (EM_JS in bridge/src/ml_bridge.cpp): async
        // (Float32Array spectrogram, rows, cols) => { classes, probabilities }.
        sigMlClassifier: async (spectrogram, rows, cols) => (await classifier).classify(spectrogram, rows, cols),
      });
      window.sigApp = app;   // the Embind hooks (sigAppOpenFile, sigAppState), for scripts and tests

      // Drag-and-drop: the same path as "Open File...", from the page.
      let depth = 0;
      addEventListener('dragenter', (e) => { if (e.dataTransfer?.types?.includes('Files')) { depth++; drop.style.display = 'flex'; e.preventDefault(); } });
      addEventListener('dragover', (e) => e.preventDefault());
      addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; drop.style.display = 'none'; } });
      addEventListener('drop', async (e) => {
        e.preventDefault();
        depth = 0;
        drop.style.display = 'none';
        const file = e.dataTransfer?.files?.[0];
        if (!file) return;
        try {
          app.sigAppOpenFile(new Uint8Array(await file.arrayBuffer()), file.name);
        } catch (err) {
          console.error('could not load the dropped file', err);
        }
      });
    } catch (e) {
      fail('Failed to load the application', e);
    }
  </script>
</body>
</html>
